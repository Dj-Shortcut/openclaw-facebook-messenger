name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match package.json"
        required: true
        type: string
      changelog:
        description: "ClawHub release changelog"
        required: true
        type: string
      dry_run:
        description: "Validate and preview only"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Validate and publish package
    runs-on: ubuntu-latest
    environment: clawhub-release

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm run build
          npm test
          npm pack --dry-run

      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"

      - name: Log in to ClawHub
        if: ${{ inputs.dry_run == false }}
        env:
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          test -n "$CLAWHUB_TOKEN"
          npx --yes clawhub@0.22.0 login --token "$CLAWHUB_TOKEN" --label "GitHub Actions"
          npx --yes clawhub@0.22.0 whoami

      - name: Publish package to ClawHub
        env:
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          args=(
            package
            publish
            .
            --family code-plugin
            --owner dj-shortcut
            --version "$RELEASE_VERSION"
            --changelog "$RELEASE_CHANGELOG"
            --source-repo "Dj-Shortcut/openclaw-facebook-messenger"
            --source-commit "$GITHUB_SHA"
            --source-ref "$GITHUB_REF_NAME"
            --json
          )
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          npx --yes clawhub@0.22.0 "${args[@]}"

      - name: Verify public ClawHub release
        if: ${{ inputs.dry_run == false }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version_endpoint="https://clawhub.ai/api/v1/packages/%40dj-shortcut%2Ffacebook/versions/${RELEASE_VERSION}"
          package_endpoint="https://clawhub.ai/api/v1/packages/%40dj-shortcut%2Ffacebook"

          for attempt in $(seq 1 20); do
            version_response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${CLAWHUB_TOKEN}" \
              "${version_endpoint}?readback=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")"
            version_status="${version_response##*$'\n'}"
            version_body="${version_response%$'\n'*}"

            package_response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${CLAWHUB_TOKEN}" \
              "${package_endpoint}?readback=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")"
            package_status="${package_response##*$'\n'}"
            package_body="${package_response%$'\n'*}"

            if [[ "${version_status}" == "200" && "${package_status}" == "200" ]]; then
              visible_version="$(jq -r '.version.version // empty' <<<"${version_body}")"
              latest_version="$(jq -r '.package.latestVersion // empty' <<<"${package_body}")"
              source_repo="$(jq -r '.version.verification.sourceRepo // empty' <<<"${version_body}")"

              if [[ "${visible_version}" == "${RELEASE_VERSION}" && \
                    "${latest_version}" == "${RELEASE_VERSION}" && \
                    "${source_repo}" == "Dj-Shortcut/openclaw-facebook-messenger" ]]; then
                echo "ClawHub public read-back confirmed: ${visible_version}"
                exit 0
              fi
            fi

            if (( attempt == 20 )); then
              echo "ClawHub accepted the upload, but the exact release was not publicly visible after 10 minutes." >&2
              exit 1
            fi

            echo "Waiting for ClawHub verification/publication (${attempt}/20; version HTTP ${version_status}, package HTTP ${package_status})"
            sleep 30
          done
